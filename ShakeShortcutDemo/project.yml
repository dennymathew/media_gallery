name: ShakeShortcutDemo
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
targets:
  ShakeShortcutDemo:
    type: application
    platform: iOS
    sources: [ShakeShortcutDemo]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.ShakeShortcutDemo
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
